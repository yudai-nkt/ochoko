name = "ochoko"
target = "erlang"
version = "1.0.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.5.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
wisp = ">= 2.2.2 and < 3.0.0"
# Fork of mist 6.0.3 that accepts raw [ ] in the query (Elk sends id[]=...);
# back to Hex once released upstream. See docs/e2e-tests.md.
mist = { git = "https://github.com/yudai-nkt/mist.git", ref = "e496881894b46e4cd43826edf9d15096819fc347" }
sqlight = ">= 1.2.0 and < 2.0.0"
tom = ">= 2.1.0 and < 3.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
argus = ">= 2.0.0 and < 3.0.0"
ochoko_shared = { path = "../shared" }
argv = ">= 1.1.0 and < 2.0.0"
mochiweb = ">= 3.6.1 and < 4.0.0"

[erlang]
extra_applications = ["inets", "public_key"]

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
